[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-transcribe"
version = "0.3.0"
description = "Transcribe audio with Gemini and speaker labels"
requires-python = ">=3.12"
dependencies = ["google-genai==2.30.0"]

[project.scripts]
gemini-transcribe = "gemini_transcribe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_transcribe"]
